<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Present Minds | Newsletter</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="nav-placeholder"></div>

    <section class="section-container">
        <h2>Digital Library</h2>
        <p class="section-intro" style="text-align: center; margin-bottom: 2rem;">Monthly newsletter releases designed in an authentic newspaper style.</p>
        
        <div class="about-grid">
            <div class="placeholder-box">
                <span>[Current Issue: AP Neuro Campaign Progress]</span>
            </div>
            <div class="placeholder-box">
                <span>[Current Issue: Podcast Links & Informative Diagrams]</span>
            </div>
        </div>
    </section>

    <section class="section-container pink-bg-darker">
        <h2>Subscribe to Our Newsletter</h2>
        <div class="newsletter-box">
            <input type="email" placeholder="Enter your email">
            <button class="btn">Subscribe</button>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script>
        fetch('navbar.html').then(response => response.text()).then(data => {
            document.getElementById('nav-placeholder').innerHTML = data;
        });
        fetch('footer.html').then(response => response.text()).then(data => {
            document.getElementById('footer-placeholder').innerHTML = data;
        });
    </script>
</body>
</html>
